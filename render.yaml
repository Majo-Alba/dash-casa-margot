services:
  - type: web
    name: dash-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CASA_MARGOT_CONTACTOS_CSV_URL
        sync: false
      - key: CASA_MARGOT_ESFUERZOS_CSV_URL
        sync: false
      - key: CASA_MARGOT_CLIENTES_CSV_URL
        sync: false
      - key: CASA_MARGOT_PRODUCTOS_CSV_URL
        sync: false
      - key: CASA_MARGOT_VENTAS_CSV_URL
        sync: false

  - type: web
    name: dash-web
    runtime: static
    rootDir: client/dash
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
